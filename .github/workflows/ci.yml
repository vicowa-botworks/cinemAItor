name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Lint backend
        working-directory: ./backend
        run: deno lint

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: deno install

      - name: Lint frontend (ESLint)
        working-directory: ./frontend
        run: deno run -A npm:eslint@^9.33.0 .

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Type check backend
        working-directory: ./backend
        run: deno check src tests

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: deno install

      - name: Type check frontend
        working-directory: ./frontend
        run: deno check src tests

  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Check formatting
        run: deno fmt --check

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Run backend tests
        working-directory: ./backend
        run: deno test --allow-net --allow-env --allow-read --allow-write --allow-ffi --allow-run

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Parse-check frontend modules
        working-directory: ./frontend
        run: |
          # deno check skips .js files, so a browser-only syntax error (e.g. an
          # await in a non-async method) would ship uncaught. Node parses every
          # module the way the browser's module loader would.
          status=0
          for f in $(find src tests -name '*.js' | sort); do
            if ! node --input-type=module --check < "$f" 2>/tmp/syntax-error.txt; then
              echo "SYNTAX ERROR in $f:"
              cat /tmp/syntax-error.txt
              status=1
            fi
          done
          exit $status

      - name: Run frontend tests
        working-directory: ./frontend
        run: deno test --allow-net --allow-env

  e2e-smoke:
    name: E2E Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Install Playwright
        working-directory: ./e2e
        run: npm install

      - name: Install Chromium
        working-directory: ./e2e
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke
        working-directory: ./e2e
        run: npx playwright test

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t cinemaitor:${{ github.sha }} .
