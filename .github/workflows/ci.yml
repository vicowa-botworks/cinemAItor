name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Lint backend
        working-directory: ./backend
        run: deno lint

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: deno install

      - name: Lint frontend (ESLint)
        working-directory: ./frontend
        run: deno run -A npm:eslint@^9.33.0 .

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Type check backend
        working-directory: ./backend
        run: deno check src tests

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: deno install

      - name: Type check frontend
        working-directory: ./frontend
        run: deno check src tests

  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Check formatting
        run: deno fmt --check

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Run backend tests
        working-directory: ./backend
        run: deno test --allow-net --allow-env --allow-read --allow-write --allow-ffi --allow-run

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Run frontend tests
        working-directory: ./frontend
        run: deno test --allow-net --allow-env

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t cinemaitor:${{ github.sha }} .
